<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
    body {
        background-color: #0073ff;

    }
    fieldset {
    border-color: blue;
    border: 2px solid blue;
    border-radius: 10px;
    }
    input {
    background-color: rgb(5, 138, 255);
    color: rgb(255, 255, 255);
    border: 1px solid blue;
    border-radius: 5px;
    padding: 8px;
    }
    input:focus {
    background-color: rgb(0, 153, 255);
    outline: 2px solid blue;
    }
    input::placeholder {
    color: rgb(255, 255, 255);
    }
    body {
    color: rgb(255, 255, 255);
    }

    input {
    color: rgb(253, 253, 255);
    }

    legend {
    color: rgb(255, 255, 255);
    }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome_completo">Nome Completo:</label>
            <input type="text" id="nome_completo" name="nome_completo" placeholder="Digite seu Nome completo">
    </form>
    <form>
            <label for="dt-nascimento">Data de Nascimento:</label>
            <input type="date" id="dt-nascimento" name="dt-nascimento">
    </form>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" placeholder="Digite sua Idade aqui:">
    <form>
            <label> Nome da Mãe:</label>
            <input type="text" id="nome_mae" name="nome_mae" placeholder="Digite o Nome da Mãe aqui:">
    </form>
            <label> Email:</label>
            <input type="text" id="email" name="email" placeholder="Digite seu Email aqui:">
    
    <form>
         <label for="uf">Unidade Federativa:</label>
         <select id="uf" name="uf">
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
        </select>
    </form>

            <label> Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua Senha aqui:">
        </fieldset>

        <fieldset>
            <legend>Gênero</legend>
            <label for="sexo">Selecione uma opção:</label>
            <input type="radio" id="masculino" name="sexo" value="masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="sexo" value="feminino">
            <label for="feminino">Feminino</label>
            <input type="radio" id="outro" name="sexo" value="outro">
            <label for="outro">Outro</label>
        </fieldset>

        <fieldset>
            <legend>Cursos</legend>
            <label for="ti">TI</label>
            <input type="checkbox" id="ti" name="cursos" value="TI">

            <label for="mecanica-a">Mecanica aeronáutica</label>
            <input type="checkbox" id="mecanica-a" name="cursos" value="mecanica-a">
        </fieldset>

        <input type="submit" name="Enviar" value="Enviar">
    </form>
</body>
</html>
